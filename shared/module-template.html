<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <script>
        (function () {
            const theme = localStorage.getItem('placementPrep_theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Mastery - PlacementPrep</title>
    <meta name="description" content="Master placement preparation concepts with interactive practice, timed MNC exams, and fast revision flashcards on PlacementPrep.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="module-system.css?v=1.1">
</head>
<body class="module-page-body">

    <!-- Top Module Navigation Bar (Rendered by ModuleSystem) -->
    <header class="app-header"></header>

    <!-- Main Container -->
    <main class="app-main">
        <!-- Landing View (Rendered by ModuleSystem) -->
        <section id="screen-mode-select" class="screen-view"></section>
    </main>

    <!-- SyncManager & Module Engine -->
    <script src="../syncManager.js?v=1.1"></script>
    <script src="module-system.js?v=1.1"></script>
    <script src="cbt-exam-system.js?v=1.1"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const modId = params.get('mod') || 'programming_fundamentals';
            window.ModuleSystem.init(modId);

            // Handle start mode navigation if clicking modes
            window.addEventListener('module:mode-selected', function (e) {
                const mode = e.detail.mode;
                const routeMap = {
                    'programming_fundamentals': '../programming_fundamentals/index.html',
                    'networking': '../networking/index.html',
                    'cloud_computing': '../cloud_Computing/index.html',
                    'github': '../github/index.html',
                    'cyber_security': '../cyber_security/index.html',
                    'pseudocode': '../Pseudocode/index.html',
                    'ai_ml': '../ai_ml/index.html',
                    'linux_commands': '../linux_commands/index.html',
                    'browser_fundamental': '../browser_fundamental/index.html',
                    'office_suite': '../Microsoft%20Office%20Suite%20Mastery/index.html'
                };
                if (routeMap[modId]) {
                    window.location.href = `${routeMap[modId]}?mode=${mode}`;
                } else {
                    window.location.href = `../programming_fundamentals/index.html?mode=${mode}`;
                }
            });
        })();
    </script>
</body>
</html>
