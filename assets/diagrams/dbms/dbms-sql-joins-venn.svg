<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%" style="background: linear-gradient(135deg, #090D16 0%, #111827 100%); border-radius: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <title>SQL Joins: INNER, LEFT, RIGHT, FULL OUTER</title>
  <text x="420" y="36" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800">Visual SQL Joins: Relational Set Intersections</text>
  <text x="420" y="56" text-anchor="middle" fill="#94A3B8" font-size="12">How relational queries combine Table A and Table B records on matching keys</text>

  <!-- 4 Joins in 2x2 Grid -->
  <!-- 1. INNER JOIN -->
  <g transform="translate(60, 85)">
    <rect x="0" y="0" width="340" height="150" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="170" y="24" text-anchor="middle" fill="#38BDF8" font-size="13" font-weight="800">INNER JOIN (Intersection Only)</text>
    
    <!-- Venn Diagram -->
    <g transform="translate(60, 40)">
      <circle cx="45" cy="40" r="32" fill="#0F172A" stroke="#475569" stroke-width="2"/>
      <circle cx="85" cy="40" r="32" fill="#0F172A" stroke="#475569" stroke-width="2"/>
      <!-- Intersection clip -->
      <path d="M 65 15 A 32 32 0 0 1 65 65 A 32 32 0 0 1 65 15" fill="#38BDF8"/>
      <text x="32" y="44" fill="#94A3B8" font-size="9" font-weight="700">Table A</text>
      <text x="96" y="44" fill="#94A3B8" font-size="9" font-weight="700">Table B</text>
    </g>

    <g transform="translate(180, 50)">
      <text x="0" y="15" fill="#E2E8F0" font-size="10">Returns ONLY rows that have</text>
      <text x="0" y="30" fill="#E2E8F0" font-size="10">matching values in BOTH tables.</text>
      <rect x="0" y="42" width="145" height="26" rx="4" fill="#0F172A"/>
      <text x="8" y="59" fill="#38BDF8" font-size="9" font-family="monospace">FROM A INNER JOIN B</text>
    </g>
  </g>

  <!-- 2. LEFT JOIN -->
  <g transform="translate(440, 85)">
    <rect x="0" y="0" width="340" height="150" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="170" y="24" text-anchor="middle" fill="#34D399" font-size="13" font-weight="800">LEFT OUTER JOIN (All A + Matches)</text>

    <!-- Venn Diagram -->
    <g transform="translate(60, 40)">
      <circle cx="45" cy="40" r="32" fill="#10B981" stroke="#34D399" stroke-width="2"/>
      <circle cx="85" cy="40" r="32" fill="#0F172A" stroke="#475569" stroke-width="2"/>
      <!-- Intersection clip -->
      <path d="M 65 15 A 32 32 0 0 1 65 65 A 32 32 0 0 1 65 15" fill="#10B981"/>
      <text x="32" y="44" fill="#FFF" font-size="9" font-weight="700">Table A</text>
      <text x="96" y="44" fill="#94A3B8" font-size="9" font-weight="700">Table B</text>
    </g>

    <g transform="translate(180, 50)">
      <text x="0" y="15" fill="#E2E8F0" font-size="10">Returns ALL rows from Left (A).</text>
      <text x="0" y="30" fill="#E2E8F0" font-size="10">Non-matching B columns = <tspan fill="#F87171" font-weight="700">NULL</tspan></text>
      <rect x="0" y="42" width="145" height="26" rx="4" fill="#0F172A"/>
      <text x="8" y="59" fill="#34D399" font-size="9" font-family="monospace">FROM A LEFT JOIN B</text>
    </g>
  </g>

  <!-- 3. RIGHT JOIN -->
  <g transform="translate(60, 255)">
    <rect x="0" y="0" width="340" height="150" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="170" y="24" text-anchor="middle" fill="#FBBF24" font-size="13" font-weight="800">RIGHT OUTER JOIN (Matches + All B)</text>

    <!-- Venn Diagram -->
    <g transform="translate(60, 40)">
      <circle cx="45" cy="40" r="32" fill="#0F172A" stroke="#475569" stroke-width="2"/>
      <circle cx="85" cy="40" r="32" fill="#F59E0B" stroke="#FBBF24" stroke-width="2"/>
      <text x="32" y="44" fill="#94A3B8" font-size="9" font-weight="700">Table A</text>
      <text x="96" y="44" fill="#FFF" font-size="9" font-weight="700">Table B</text>
    </g>

    <g transform="translate(180, 50)">
      <text x="0" y="15" fill="#E2E8F0" font-size="10">Returns ALL rows from Right (B).</text>
      <text x="0" y="30" fill="#E2E8F0" font-size="10">Non-matching A columns = <tspan fill="#F87171" font-weight="700">NULL</tspan></text>
      <rect x="0" y="42" width="145" height="26" rx="4" fill="#0F172A"/>
      <text x="8" y="59" fill="#FBBF24" font-size="9" font-family="monospace">FROM A RIGHT JOIN B</text>
    </g>
  </g>

  <!-- 4. FULL OUTER JOIN -->
  <g transform="translate(440, 255)">
    <rect x="0" y="0" width="340" height="150" rx="8" fill="#1E293B" stroke="#C084FC" stroke-width="1.5"/>
    <text x="170" y="24" text-anchor="middle" fill="#C084FC" font-size="13" font-weight="800">FULL OUTER JOIN (Complete Union)</text>

    <!-- Venn Diagram -->
    <g transform="translate(60, 40)">
      <circle cx="45" cy="40" r="32" fill="#8B5CF6" stroke="#C084FC" stroke-width="2"/>
      <circle cx="85" cy="40" r="32" fill="#8B5CF6" stroke="#C084FC" stroke-width="2"/>
      <text x="32" y="44" fill="#FFF" font-size="9" font-weight="700">Table A</text>
      <text x="96" y="44" fill="#FFF" font-size="9" font-weight="700">Table B</text>
    </g>

    <g transform="translate(180, 50)">
      <text x="0" y="15" fill="#E2E8F0" font-size="10">Returns ALL rows when match in</text>
      <text x="0" y="30" fill="#E2E8F0" font-size="10">EITHER A or B (fills NULLs).</text>
      <rect x="0" y="42" width="145" height="26" rx="4" fill="#0F172A"/>
      <text x="8" y="59" fill="#C084FC" font-size="9" font-family="monospace">FROM A FULL JOIN B</text>
    </g>
  </g>

  <text x="420" y="430" text-anchor="middle" fill="#CBD5E1" font-size="11">Placement Rule: In MySQL, FULL OUTER JOIN is simulated by combining <tspan fill="#38BDF8">LEFT JOIN</tspan> UNION <tspan fill="#FBBF24">RIGHT JOIN</tspan>.</text>
</svg>
