<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%" style="background: linear-gradient(135deg, #090D16 0%, #111827 100%); border-radius: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <title>Control Flow: For & While Loop Execution Flowchart</title>
  <text x="420" y="36" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800">Iteration Logic: Loop Lifecycle, Break, &amp; Continue Control</text>
  <text x="420" y="56" text-anchor="middle" fill="#94A3B8" font-size="12">Flowchart tracing variable updates, condition tests, and exit branching</text>

  <!-- Start Node -->
  <g transform="translate(420, 85)">
    <rect x="-80" y="0" width="160" height="35" rx="17" fill="#0284C7"/>
    <text x="0" y="22" text-anchor="middle" fill="#FFF" font-size="11" font-weight="800">Initialization (i = 0)</text>
  </g>

  <line x1="420" y1="120" x2="420" y2="150" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Diamond: Condition Test -->
  <g transform="translate(420, 190)">
    <polygon points="0,-35 75,0 0,35 -75,0" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" fill="#FBBF24" font-size="11" font-weight="800">Condition Test</text>
    <text x="0" y="13" text-anchor="middle" fill="#DDD" font-size="9">(i &lt; N?)</text>
  </g>

  <!-- True Branch (Down) -->
  <line x1="420" y1="225" x2="420" y2="260" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <text x="435" y="245" fill="#34D399" font-size="10" font-weight="800">TRUE</text>

  <!-- Loop Body -->
  <g transform="translate(340, 260)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="80" y="22" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="700">Loop Body Execution</text>
    <text x="80" y="38" text-anchor="middle" fill="#94A3B8" font-size="9">statements; print(i);</text>
  </g>

  <!-- Increment / Update -->
  <line x1="420" y1="310" x2="420" y2="340" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(340, 340)">
    <rect x="0" y="0" width="160" height="35" rx="6" fill="#1E293B" stroke="#A855F7"/>
    <text x="80" y="22" text-anchor="middle" fill="#C084FC" font-size="11" font-weight="700">Update Step (i++)</text>
  </g>

  <!-- Loop Back Arrow to Condition -->
  <path d="M 340 357 L 270 357 L 270 190 L 340 190" fill="none" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="250" y="270" text-anchor="end" fill="#C084FC" font-size="9" font-weight="700">Next Iteration</text>

  <!-- False Branch (Right Exit) -->
  <line x1="495" y1="190" x2="580" y2="190" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="535" y="180" text-anchor="middle" fill="#F87171" font-size="10" font-weight="800">FALSE</text>

  <g transform="translate(585, 172)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="#EF4444"/>
    <text x="65" y="22" text-anchor="middle" fill="#FFF" font-size="11" font-weight="800">Exit Loop → End</text>
  </g>

  <!-- Side Callout: break vs continue -->
  <g transform="translate(40, 220)">
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#1E293B" stroke="#334155"/>
    <text x="15" y="24" fill="#FBBF24" font-size="11" font-weight="800">Placement Control Traps:</text>
    <text x="15" y="48" fill="#EF4444" font-size="10" font-weight="700">• break:</text>
    <text x="15" y="64" fill="#CBD5E1" font-size="9">Exits loop completely immediately.</text>
    <text x="15" y="88" fill="#34D399" font-size="10" font-weight="700">• continue:</text>
    <text x="15" y="104" fill="#CBD5E1" font-size="9">Skips remainder of body, jumps to update!</text>
  </g>

  <!-- Footer Tip -->
  <text x="420" y="425" text-anchor="middle" fill="#CBD5E1" font-size="11">Infinite Loop Trap: Forgetting <tspan fill="#F87171" font-family="monospace">i++</tspan> or testing conditions that never become false causes CPU lockup.</text>
</svg>
