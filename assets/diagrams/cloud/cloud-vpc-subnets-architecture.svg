<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%" style="background: linear-gradient(135deg, #090D16 0%, #111827 100%); border-radius: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <title>AWS VPC and Subnet Architecture</title>
  <text x="420" y="36" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800">Virtual Private Cloud (VPC) &amp; Subnet Network Security</text>
  <text x="420" y="56" text-anchor="middle" fill="#94A3B8" font-size="12">Public vs Private Subnet, Internet Gateway (IGW), and NAT Gateway flow</text>

  <!-- Big VPC Outer Box -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="760" height="320" rx="12" fill="url(#grad-card)" stroke="#38BDF8" stroke-width="2" filter="url(#shadow)"/>
    <text x="25" y="30" fill="#38BDF8" font-size="14" font-weight="800">VPC (CIDR: 10.0.0.0/16)</text>
    
    <!-- Internet Gateway -->
    <g transform="translate(180, 15)">
      <rect x="0" y="0" width="130" height="30" rx="6" fill="#1E3A8A" stroke="#3B82F6"/>
      <text x="65" y="19" text-anchor="middle" fill="#93C5FD" font-size="10" font-weight="700">Internet Gateway (IGW)</text>
    </g>

    <!-- Public Subnet (Left) -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="330" height="235" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
      <rect x="0" y="0" width="330" height="30" rx="8" fill="#14532D"/>
      <text x="165" y="20" text-anchor="middle" fill="#34D399" font-size="12" font-weight="800">Public Subnet (10.0.1.0/24)</text>

      <!-- Components inside Public Subnet -->
      <rect x="20" y="45" width="130" height="65" rx="6" fill="#1E293B" stroke="#38BDF8"/>
      <text x="85" y="70" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="700">Public EC2 / ALB</text>
      <text x="85" y="86" text-anchor="middle" fill="#94A3B8" font-size="9">Web Server (Port 80/443)</text>
      <text x="85" y="100" text-anchor="middle" fill="#34D399" font-size="8">Public IP assigned</text>

      <rect x="175" y="45" width="135" height="65" rx="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="242" y="70" text-anchor="middle" fill="#FBBF24" font-size="11" font-weight="700">NAT Gateway</text>
      <text x="242" y="86" text-anchor="middle" fill="#94A3B8" font-size="9">Outbound internet for</text>
      <text x="242" y="100" text-anchor="middle" fill="#FBBF24" font-size="8">Private Subnet</text>

      <text x="165" y="150" text-anchor="middle" fill="#E2E8F0" font-size="10">Route Table has direct route to IGW (0.0.0.0/0 → IGW)</text>
      <text x="165" y="175" text-anchor="middle" fill="#A7F3D0" font-size="10" font-weight="600">Accessible from public World Wide Web</text>
    </g>

    <!-- Arrow between Public & Private -->
    <line x1="365" y1="180" x2="395" y2="180" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Private Subnet (Right) -->
    <g transform="translate(405, 60)">
      <rect x="0" y="0" width="330" height="235" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
      <rect x="0" y="0" width="330" height="30" rx="8" fill="#450A0A"/>
      <text x="165" y="20" text-anchor="middle" fill="#F87171" font-size="12" font-weight="800">Private Subnet (10.0.2.0/24)</text>

      <!-- Components inside Private Subnet -->
      <rect x="20" y="45" width="135" height="65" rx="6" fill="#1E293B" stroke="#8B5CF6"/>
      <text x="87" y="70" text-anchor="middle" fill="#C084FC" font-size="11" font-weight="700">App Server EC2</text>
      <text x="87" y="86" text-anchor="middle" fill="#94A3B8" font-size="9">Business Logic</text>
      <text x="87" y="100" text-anchor="middle" fill="#F87171" font-size="8">NO Public IP</text>

      <rect x="175" y="45" width="135" height="65" rx="6" fill="#1E293B" stroke="#10B981"/>
      <text x="242" y="70" text-anchor="middle" fill="#34D399" font-size="11" font-weight="700">RDS Database</text>
      <text x="242" y="86" text-anchor="middle" fill="#94A3B8" font-size="9">MySQL / PostgreSQL</text>
      <text x="242" y="100" text-anchor="middle" fill="#F87171" font-size="8">NO Public Internet Access</text>

      <text x="165" y="150" text-anchor="middle" fill="#E2E8F0" font-size="10">Route Table sends 0.0.0.0/0 to NAT Gateway</text>
      <text x="165" y="175" text-anchor="middle" fill="#FCA5A5" font-size="10" font-weight="600">Shielded from incoming hackers &amp; direct internet</text>
    </g>
  </g>

  <!-- Footer Tip -->
  <text x="420" y="430" text-anchor="middle" fill="#CBD5E1" font-size="11">Placement Trap: Databases should ALWAYS live in a Private Subnet. NAT Gateways allow private EC2s to download security patches without exposing them to inbound attacks.</text>
</svg>
