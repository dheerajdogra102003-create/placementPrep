<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%" style="background: linear-gradient(135deg, #090D16 0%, #111827 100%); border-radius: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <title>Scalability vs Elasticity Comparison</title>
  <text x="420" y="36" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800">Placement Trap: Scalability vs Elasticity</text>
  <text x="420" y="58" text-anchor="middle" fill="#94A3B8" font-size="12">Scalability = Capacity to grow | Elasticity = Automatic real-time adjustment with fluctuating demand</text>

  <!-- Left Card: Scalability -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="360" height="340" rx="12" fill="url(#grad-card)" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="360" height="42" rx="12" fill="#1E293B"/>
    <text x="180" y="26" text-anchor="middle" fill="#38BDF8" font-size="15" font-weight="700">⚡ Scalability (Planned Growth)</text>

    <!-- Subtype A: Vertical -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="150" height="150" rx="8" fill="#0F172A" stroke="#334155"/>
      <text x="75" y="24" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="700">Scale UP (Vertical)</text>
      <!-- Small server to Big server -->
      <rect x="55" y="40" width="40" height="28" rx="4" fill="#3B82F6"/>
      <text x="75" y="58" text-anchor="middle" fill="#FFF" font-size="9">4GB RAM</text>
      <line x1="75" y1="72" x2="75" y2="88" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="35" y="94" width="80" height="38" rx="4" fill="#2563EB"/>
      <text x="75" y="112" text-anchor="middle" fill="#FFF" font-size="10" font-weight="700">64GB RAM / 16-Core</text>
      <text x="75" y="125" text-anchor="middle" fill="#94A3B8" font-size="8">Hardware Limit Reached</text>
    </g>

    <!-- Subtype B: Horizontal -->
    <g transform="translate(190, 60)">
      <rect x="0" y="0" width="150" height="150" rx="8" fill="#0F172A" stroke="#334155"/>
      <text x="75" y="24" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="700">Scale OUT (Horizontal)</text>
      <!-- Add more servers -->
      <rect x="20" y="44" width="32" height="28" rx="3" fill="#10B981"/><text x="36" y="61" text-anchor="middle" fill="#FFF" font-size="8">VM 1</text>
      <text x="75" y="62" text-anchor="middle" fill="#38BDF8" font-size="16" font-weight="800">+</text>
      <rect x="98" y="44" width="32" height="28" rx="3" fill="#10B981"/><text x="114" y="61" text-anchor="middle" fill="#FFF" font-size="8">VM 2</text>
      <line x1="75" y1="80" x2="75" y2="95" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(15, 102)">
        <rect x="0" y="0" width="26" height="24" rx="2" fill="#059669"/><text x="13" y="15" text-anchor="middle" fill="#FFF" font-size="7">VM1</text>
        <rect x="31" y="0" width="26" height="24" rx="2" fill="#059669"/><text x="44" y="15" text-anchor="middle" fill="#FFF" font-size="7">VM2</text>
        <rect x="62" y="0" width="26" height="24" rx="2" fill="#059669"/><text x="75" y="15" text-anchor="middle" fill="#FFF" font-size="7">VM3</text>
        <rect x="93" y="0" width="26" height="24" rx="2" fill="#059669"/><text x="106" y="15" text-anchor="middle" fill="#FFF" font-size="7">VM4</text>
      </g>
      <text x="75" y="140" text-anchor="middle" fill="#34D399" font-size="9" font-weight="600">Virtually Unlimited</text>
    </g>

    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="320" height="95" rx="6" fill="#0F172A" stroke="#1E293B"/>
      <text x="12" y="22" fill="#38BDF8" font-size="11" font-weight="700">Key Properties:</text>
      <text x="12" y="40" fill="#CBD5E1" font-size="10">• Handles predictable, long-term systematic growth</text>
      <text x="12" y="58" fill="#CBD5E1" font-size="10">• Example: User base doubles over 1 year (add capacity)</text>
      <text x="12" y="76" fill="#CBD5E1" font-size="10">• Typically manually or semi-automatically triggered</text>
    </g>
  </g>

  <!-- Right Card: Elasticity -->
  <g transform="translate(440, 85)">
    <rect x="0" y="0" width="360" height="340" rx="12" fill="url(#grad-card)" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="360" height="42" rx="12" fill="#1E293B"/>
    <text x="180" y="26" text-anchor="middle" fill="#34D399" font-size="15" font-weight="700">🔄 Elasticity (Dynamic Real-Time Adaptation)</text>

    <!-- Visual Curve: Wave with Auto-Scale -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="320" height="150" rx="8" fill="#0F172A" stroke="#334155"/>
      <text x="160" y="20" text-anchor="middle" fill="#94A3B8" font-size="10">Traffic Spike vs Instance Allocation (Pay-As-You-Go)</text>

      <!-- Grid lines -->
      <line x1="30" y1="125" x2="300" y2="125" stroke="#334155" stroke-width="1"/>
      <line x1="30" y1="35" x2="30" y2="125" stroke="#334155" stroke-width="1"/>
      <text x="25" y="42" text-anchor="end" fill="#64748B" font-size="9">Load</text>
      <text x="300" y="138" text-anchor="end" fill="#64748B" font-size="9">Time (Hours)</text>

      <!-- Demand Curve -->
      <path d="M 35 110 Q 90 100 130 50 Q 170 45 210 55 Q 250 115 295 115" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,3"/>
      <text x="140" y="45" fill="#F59E0B" font-size="9" font-weight="700">Demand Curve</text>

      <!-- Elastic Provisioning Step Curve -->
      <path d="M 35 105 L 105 105 L 105 55 L 225 55 L 225 105 L 295 105" fill="none" stroke="#10B981" stroke-width="2"/>
      <text x="180" y="70" fill="#34D399" font-size="9" font-weight="700">Auto-Scaling Provision</text>

      <!-- Badge annotations -->
      <rect x="110" y="85" width="100" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981"/>
      <text x="160" y="99" text-anchor="middle" fill="#34D399" font-size="8" font-weight="600">Expands on Flash Sale</text>
      <rect x="230" y="85" width="80" height="20" rx="4" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444"/>
      <text x="270" y="99" text-anchor="middle" fill="#FCA5A5" font-size="8" font-weight="600">Shrinks to Zero/Min</text>
    </g>

    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="320" height="95" rx="6" fill="#0F172A" stroke="#1E293B"/>
      <text x="12" y="22" fill="#34D399" font-size="11" font-weight="700">Key Properties:</text>
      <text x="12" y="40" fill="#CBD5E1" font-size="10">• Automatically expands AND shrinks matching real-time load</text>
      <text x="12" y="58" fill="#CBD5E1" font-size="10">• Real-life: Black Friday / Flipkart Big Billion Day traffic surge</text>
      <text x="12" y="76" fill="#CBD5E1" font-size="10">• Prevents overprovisioning waste &amp; SLA crashes</text>
    </g>
  </g>

  <!-- Summary Footer -->
  <text x="420" y="445" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="600">Mnemonic: "Scalability is the potential size of the balloon. Elasticity is inflating and deflating as needed."</text>
</svg>
