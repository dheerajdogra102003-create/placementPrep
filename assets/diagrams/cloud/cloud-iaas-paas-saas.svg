<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%" style="background: linear-gradient(135deg, #090D16 0%, #111827 100%); border-radius: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <title>IaaS vs PaaS vs SaaS Shared Responsibility Model</title>
  <text x="420" y="38" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800" letter-spacing="-0.02em">Cloud Service Models: IaaS vs PaaS vs SaaS Responsibility Stack</text>
  <text x="420" y="60" text-anchor="middle" fill="#94A3B8" font-size="12">Blue = You Manage (Client) | Purple = Cloud Provider Manages (Vendor)</text>

  <!-- Legend -->
  <g transform="translate(280, 75)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#3B82F6"/>
    <text x="24" y="13" fill="#E2E8F0" font-size="12" font-weight="600">You Manage</text>
    <rect x="150" y="0" width="16" height="16" rx="4" fill="#8B5CF6"/>
    <text x="174" y="13" fill="#E2E8F0" font-size="12" font-weight="600">Cloud Provider</text>
  </g>

  <!-- Column 1: On-Premises -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="165" height="340" rx="10" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="42" rx="10" fill="#1E293B"/>
    <text x="82" y="26" text-anchor="middle" fill="#F1F5F9" font-size="13" font-weight="700">On-Premises</text>
    <text x="82" y="38" text-anchor="middle" fill="#64748B" font-size="10">Traditional Datacenter</text>
    
    <!-- 8 Layers - All Blue -->
    <rect x="12" y="55" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="74" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Applications</text>
    <rect x="12" y="89" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="108" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Data &amp; Database</text>
    <rect x="12" y="123" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="142" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Runtime (JVM/Node)</text>
    <rect x="12" y="157" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="176" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Middleware</text>
    <rect x="12" y="191" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="210" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Operating System</text>
    <rect x="12" y="225" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="244" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Virtualization</text>
    <rect x="12" y="259" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="278" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Servers &amp; Hardware</text>
    <rect x="12" y="293" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="312" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Storage &amp; Network</text>
    <text x="82" y="334" text-anchor="middle" fill="#38BDF8" font-size="10" font-weight="700">100% Client Responsibility</text>
  </g>

  <!-- Column 2: IaaS -->
  <g transform="translate(235, 110)">
    <rect x="0" y="0" width="165" height="340" rx="10" fill="url(#grad-card)" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="42" rx="10" fill="#1E293B"/>
    <text x="82" y="24" text-anchor="middle" fill="#38BDF8" font-size="14" font-weight="800">IaaS</text>
    <text x="82" y="37" text-anchor="middle" fill="#94A3B8" font-size="10">e.g. AWS EC2, Azure VM</text>

    <!-- Client Manages Top 5 -->
    <rect x="12" y="55" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="74" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Applications</text>
    <rect x="12" y="89" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="108" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Data &amp; Database</text>
    <rect x="12" y="123" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="142" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Runtime (JVM/Node)</text>
    <rect x="12" y="157" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="176" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Middleware</text>
    <rect x="12" y="191" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="210" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Operating System</text>
    <!-- Vendor Manages Bottom 3 -->
    <rect x="12" y="225" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="244" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Virtualization</text>
    <rect x="12" y="259" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="278" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Servers &amp; Hardware</text>
    <rect x="12" y="293" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="312" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Storage &amp; Network</text>
    <text x="82" y="334" text-anchor="middle" fill="#A78BFA" font-size="10" font-weight="700">Vendor handles hardware</text>
  </g>

  <!-- Column 3: PaaS -->
  <g transform="translate(430, 110)">
    <rect x="0" y="0" width="165" height="340" rx="10" fill="url(#grad-card)" stroke="#A855F7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="42" rx="10" fill="#1E293B"/>
    <text x="82" y="24" text-anchor="middle" fill="#C084FC" font-size="14" font-weight="800">PaaS</text>
    <text x="82" y="37" text-anchor="middle" fill="#94A3B8" font-size="10">e.g. AWS Elastic Beanstalk</text>

    <!-- Client Manages Top 2 -->
    <rect x="12" y="55" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="74" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Applications</text>
    <rect x="12" y="89" width="141" height="28" rx="6" fill="#2563EB"/><text x="82" y="108" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Data &amp; Database</text>
    <!-- Vendor Manages Bottom 6 -->
    <rect x="12" y="123" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="142" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Runtime (JVM/Node)</text>
    <rect x="12" y="157" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="176" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Middleware</text>
    <rect x="12" y="191" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="210" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Operating System</text>
    <rect x="12" y="225" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="244" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Virtualization</text>
    <rect x="12" y="259" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="278" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Servers &amp; Hardware</text>
    <rect x="12" y="293" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="312" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Storage &amp; Network</text>
    <text x="82" y="334" text-anchor="middle" fill="#C084FC" font-size="10" font-weight="700">Developers focus on CODE</text>
  </g>

  <!-- Column 4: SaaS -->
  <g transform="translate(625, 110)">
    <rect x="0" y="0" width="165" height="340" rx="10" fill="url(#grad-card)" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="165" height="42" rx="10" fill="#1E293B"/>
    <text x="82" y="24" text-anchor="middle" fill="#34D399" font-size="14" font-weight="800">SaaS</text>
    <text x="82" y="37" text-anchor="middle" fill="#94A3B8" font-size="10">e.g. Gmail, MS 365, Salesforce</text>

    <!-- Vendor Manages All 8 -->
    <rect x="12" y="55" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="74" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Applications</text>
    <rect x="12" y="89" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="108" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Data &amp; Database</text>
    <rect x="12" y="123" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="142" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Runtime (JVM/Node)</text>
    <rect x="12" y="157" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="176" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Middleware</text>
    <rect x="12" y="191" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="210" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Operating System</text>
    <rect x="12" y="225" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="244" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Virtualization</text>
    <rect x="12" y="259" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="278" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Servers &amp; Hardware</text>
    <rect x="12" y="293" width="141" height="28" rx="6" fill="#7C3AED"/><text x="82" y="312" text-anchor="middle" fill="#FFF" font-size="11" font-weight="600">Storage &amp; Network</text>
    <text x="82" y="334" text-anchor="middle" fill="#34D399" font-size="10" font-weight="700">100% Vendor Managed</text>
  </g>

  <!-- Bottom Tip -->
  <text x="420" y="480" text-anchor="middle" fill="#94A3B8" font-size="12">Placement Trap: Client always retains ownership of their actual DATA in IaaS and PaaS. In SaaS, end-users simply consume.</text>
</svg>
