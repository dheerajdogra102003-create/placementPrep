<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%" style="background: linear-gradient(135deg, #090D16 0%, #111827 100%); border-radius: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <title>Underfitting vs Good Fit vs Overfitting (Bias-Variance)</title>
  <text x="420" y="36" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800">Model Evaluation: Underfitting (High Bias) vs Overfitting (High Variance)</text>
  <text x="420" y="56" text-anchor="middle" fill="#94A3B8" font-size="12">Finding the sweet spot between an overly simple model and an overcomplicated memorizer</text>

  <!-- 3 Comparison Panels -->
  <!-- 1. Underfitting -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="235" height="325" rx="10" fill="url(#grad-card)" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="235" height="38" rx="10" fill="#1E293B"/>
    <text x="117" y="24" text-anchor="middle" fill="#F87171" font-size="13" font-weight="800">High Bias (Underfitting)</text>

    <!-- Curve Box -->
    <g transform="translate(18, 50)">
      <rect x="0" y="0" width="200" height="120" rx="6" fill="#0F172A" stroke="#334155"/>
      <!-- Dots -->
      <circle cx="20" cy="95" r="4" fill="#38BDF8"/><circle cx="50" cy="65" r="4" fill="#38BDF8"/>
      <circle cx="80" cy="45" r="4" fill="#38BDF8"/><circle cx="120" cy="40" r="4" fill="#38BDF8"/>
      <circle cx="150" cy="60" r="4" fill="#38BDF8"/><circle cx="180" cy="90" r="4" fill="#38BDF8"/>
      <!-- Bad straight line -->
      <line x1="10" y1="85" x2="190" y2="50" stroke="#EF4444" stroke-width="2.5"/>
    </g>

    <g transform="translate(15, 185)">
      <text x="0" y="15" fill="#F87171" font-size="11" font-weight="700">Diagnosis:</text>
      <text x="0" y="32" fill="#E2E8F0" font-size="10">Model is overly simple.</text>
      <text x="0" y="48" fill="#94A3B8" font-size="9">Fails to capture underlying trend.</text>
      <text x="0" y="70" fill="#FBBF24" font-size="10" font-weight="700">Performance:</text>
      <text x="0" y="86" fill="#F87171" font-size="9">High Train Error, High Test Error</text>
      <text x="0" y="108" fill="#34D399" font-size="10" font-weight="700">Fix:</text>
      <text x="0" y="122" fill="#CBD5E1" font-size="9">Add features, use complex model</text>
    </g>
  </g>

  <!-- 2. Optimal Balance -->
  <g transform="translate(302, 85)">
    <rect x="0" y="0" width="235" height="325" rx="10" fill="url(#grad-card)" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="235" height="38" rx="10" fill="#1E293B"/>
    <text x="117" y="24" text-anchor="middle" fill="#34D399" font-size="13" font-weight="800">Optimal (Good Generalization)</text>

    <!-- Curve Box -->
    <g transform="translate(18, 50)">
      <rect x="0" y="0" width="200" height="120" rx="6" fill="#0F172A" stroke="#10B981"/>
      <!-- Dots -->
      <circle cx="20" cy="95" r="4" fill="#38BDF8"/><circle cx="50" cy="65" r="4" fill="#38BDF8"/>
      <circle cx="80" cy="45" r="4" fill="#38BDF8"/><circle cx="120" cy="40" r="4" fill="#38BDF8"/>
      <circle cx="150" cy="60" r="4" fill="#38BDF8"/><circle cx="180" cy="90" r="4" fill="#38BDF8"/>
      <!-- Smooth parabolic curve -->
      <path d="M 15 105 Q 100 25 185 100" fill="none" stroke="#10B981" stroke-width="3"/>
    </g>

    <g transform="translate(15, 185)">
      <text x="0" y="15" fill="#34D399" font-size="11" font-weight="700">Diagnosis:</text>
      <text x="0" y="32" fill="#E2E8F0" font-size="10">Captures true signal, ignores noise.</text>
      <text x="0" y="48" fill="#94A3B8" font-size="9">Generalizes cleanly to unseen data.</text>
      <text x="0" y="70" fill="#FBBF24" font-size="10" font-weight="700">Performance:</text>
      <text x="0" y="86" fill="#34D399" font-size="9">Low Train Error, Low Test Error</text>
      <text x="0" y="108" fill="#38BDF8" font-size="10" font-weight="700">Sweet Spot:</text>
      <text x="0" y="122" fill="#CBD5E1" font-size="9">Balanced Bias &amp; Variance</text>
    </g>
  </g>

  <!-- 3. Overfitting -->
  <g transform="translate(565, 85)">
    <rect x="0" y="0" width="235" height="325" rx="10" fill="url(#grad-card)" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="235" height="38" rx="10" fill="#1E293B"/>
    <text x="117" y="24" text-anchor="middle" fill="#FBBF24" font-size="13" font-weight="800">High Variance (Overfitting)</text>

    <!-- Curve Box -->
    <g transform="translate(18, 50)">
      <rect x="0" y="0" width="200" height="120" rx="6" fill="#0F172A" stroke="#334155"/>
      <!-- Dots -->
      <circle cx="20" cy="95" r="4" fill="#38BDF8"/><circle cx="50" cy="65" r="4" fill="#38BDF8"/>
      <circle cx="80" cy="45" r="4" fill="#38BDF8"/><circle cx="120" cy="40" r="4" fill="#38BDF8"/>
      <circle cx="150" cy="60" r="4" fill="#38BDF8"/><circle cx="180" cy="90" r="4" fill="#38BDF8"/>
      <!-- Squiggly overfitted curve -->
      <path d="M 15 95 L 20 95 L 35 110 L 50 65 L 65 30 L 80 45 L 100 20 L 120 40 L 135 75 L 150 60 L 165 105 L 180 90 L 190 85" fill="none" stroke="#F59E0B" stroke-width="2"/>
    </g>

    <g transform="translate(15, 185)">
      <text x="0" y="15" fill="#FBBF24" font-size="11" font-weight="700">Diagnosis:</text>
      <text x="0" y="32" fill="#E2E8F0" font-size="10">Model memorized training noise.</text>
      <text x="0" y="48" fill="#94A3B8" font-size="9">Excessive degrees of freedom.</text>
      <text x="0" y="70" fill="#FBBF24" font-size="10" font-weight="700">Performance:</text>
      <text x="0" y="86" fill="#F87171" font-size="9">Zero Train Error, Terrible Test Error</text>
      <text x="0" y="108" fill="#34D399" font-size="10" font-weight="700">Fix:</text>
      <text x="0" y="122" fill="#CBD5E1" font-size="9">Regularization (L1/L2), Dropout, Prune</text>
    </g>
  </g>

  <!-- Footer Tip -->
  <text x="420" y="430" text-anchor="middle" fill="#CBD5E1" font-size="11">Interview Question: "How do you detect overfitting in production?" Answer: Training accuracy is high (99%) but validation/test accuracy drops (65%).</text>
</svg>
