<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" height="100%" style="background: linear-gradient(135deg, #090D16 0%, #111827 100%); border-radius: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <title>Critical Rendering Path: HTML to Pixels on Screen</title>
  <text x="430" y="36" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800">Browser Critical Rendering Path (CRP): HTML to Screen</text>
  <text x="430" y="56" text-anchor="middle" fill="#94A3B8" font-size="12">The 5 sequential steps a browser engine takes to paint pixels</text>

  <!-- Step 1: DOM -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="130" height="110" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="65" y="25" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="800">1. DOM Tree</text>
    <text x="65" y="48" text-anchor="middle" fill="#CBD5E1" font-size="10">HTML bytes</text>
    <text x="65" y="65" text-anchor="middle" fill="#94A3B8" font-size="9">Tokens → Nodes</text>
    <text x="65" y="85" text-anchor="middle" fill="#38BDF8" font-size="10" font-weight="600">&lt;html&gt; &lt;body&gt;</text>
  </g>

  <!-- Step 2: CSSOM -->
  <g transform="translate(40, 235)">
    <rect x="0" y="0" width="130" height="110" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5"/>
    <text x="65" y="25" text-anchor="middle" fill="#C084FC" font-size="12" font-weight="800">2. CSSOM Tree</text>
    <text x="65" y="48" text-anchor="middle" fill="#CBD5E1" font-size="10">CSS stylesheets</text>
    <text x="65" y="65" text-anchor="middle" fill="#94A3B8" font-size="9">Cascade rules</text>
    <text x="65" y="85" text-anchor="middle" fill="#C084FC" font-size="10" font-weight="600">body { color } </text>
  </g>

  <!-- Merge Arrows into Render Tree -->
  <line x1="170" y1="150" x2="235" y2="200" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="290" x2="235" y2="240" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Step 3: Render Tree -->
  <g transform="translate(245, 160)">
    <rect x="0" y="0" width="145" height="120" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <text x="72" y="28" text-anchor="middle" fill="#34D399" font-size="13" font-weight="800">3. Render Tree</text>
    <text x="72" y="55" text-anchor="middle" fill="#CBD5E1" font-size="10">Combines DOM &amp; CSSOM</text>
    <text x="72" y="75" text-anchor="middle" fill="#94A3B8" font-size="9">Only visible nodes</text>
    <text x="72" y="98" text-anchor="middle" fill="#F87171" font-size="9">(display: none omitted)</text>
  </g>

  <!-- Arrow to Layout -->
  <line x1="390" y1="220" x2="445" y2="220" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-emerald)"/>

  <!-- Step 4: Layout (Reflow) -->
  <g transform="translate(455, 160)">
    <rect x="0" y="0" width="145" height="120" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="72" y="28" text-anchor="middle" fill="#FBBF24" font-size="13" font-weight="800">4. Layout (Reflow)</text>
    <text x="72" y="55" text-anchor="middle" fill="#CBD5E1" font-size="10">Computes geometry</text>
    <text x="72" y="75" text-anchor="middle" fill="#94A3B8" font-size="9">Exact (x, y) coordinates</text>
    <text x="72" y="98" text-anchor="middle" fill="#FBBF24" font-size="10" font-weight="700">Width, Height, Box</text>
  </g>

  <!-- Arrow to Paint -->
  <line x1="600" y1="220" x2="655" y2="220" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 5: Paint & Composite -->
  <g transform="translate(665, 160)">
    <rect x="0" y="0" width="155" height="120" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="1.5"/>
    <text x="77" y="28" text-anchor="middle" fill="#F472B6" font-size="13" font-weight="800">5. Paint &amp; Composite</text>
    <text x="77" y="55" text-anchor="middle" fill="#CBD5E1" font-size="10">Fills in actual pixels</text>
    <text x="77" y="75" text-anchor="middle" fill="#94A3B8" font-size="9">Colors, shadows, text</text>
    <text x="77" y="98" text-anchor="middle" fill="#38BDF8" font-size="10" font-weight="700">GPU Composite → Screen</text>
  </g>

  <!-- Bottom Tip -->
  <g transform="translate(40, 380)">
    <rect x="0" y="0" width="780" height="55" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="390" y="24" text-anchor="middle" fill="#FBBF24" font-size="11" font-weight="700">Placement Performance Trap: Reflow vs Repaint</text>
    <text x="390" y="44" text-anchor="middle" fill="#CBD5E1" font-size="10">Changing width/height forces expensive Reflow + Repaint. Changing transform/opacity only triggers Composite on GPU.</text>
  </g>
</svg>
