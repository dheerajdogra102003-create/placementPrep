<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%" style="background: linear-gradient(135deg, #090D16 0%, #111827 100%); border-radius: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <title>The CIA Security Triad</title>
  <text x="420" y="36" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800">Information Security Foundation: The CIA Triad</text>
  <text x="420" y="56" text-anchor="middle" fill="#94A3B8" font-size="12">Confidentiality, Integrity, and Availability: The benchmark of network defense</text>

  <!-- Triangle Center Layout -->
  <!-- Top Node: Confidentiality -->
  <g transform="translate(420, 100)">
    <circle cx="0" cy="0" r="45" fill="#1E3A8A" stroke="#3B82F6" stroke-width="2.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#60A5FA" font-size="16" font-weight="900">🔒 C</text>
    <text x="0" y="65" text-anchor="middle" fill="#93C5FD" font-size="13" font-weight="800">Confidentiality</text>
    <text x="0" y="80" text-anchor="middle" fill="#94A3B8" font-size="10">Prevent unauthorized access</text>
    <text x="0" y="95" text-anchor="middle" fill="#38BDF8" font-size="9">AES-256, TLS, 2FA, RBAC</text>
  </g>

  <!-- Bottom Left Node: Integrity -->
  <g transform="translate(220, 310)">
    <circle cx="0" cy="0" r="45" fill="#14532D" stroke="#10B981" stroke-width="2.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#34D399" font-size="16" font-weight="900">🛡️ I</text>
    <text x="0" y="65" text-anchor="middle" fill="#6EE7B7" font-size="13" font-weight="800">Integrity</text>
    <text x="0" y="80" text-anchor="middle" fill="#94A3B8" font-size="10">Prevent tampering &amp; alterations</text>
    <text x="0" y="95" text-anchor="middle" fill="#34D399" font-size="9">SHA-256 Hashes, Digital Sigs</text>
  </g>

  <!-- Bottom Right Node: Availability -->
  <g transform="translate(620, 310)">
    <circle cx="0" cy="0" r="45" fill="#701A75" stroke="#D946EF" stroke-width="2.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#F472B6" font-size="16" font-weight="900">⚡ A</text>
    <text x="0" y="65" text-anchor="middle" fill="#FBCFE8" font-size="13" font-weight="800">Availability</text>
    <text x="0" y="80" text-anchor="middle" fill="#94A3B8" font-size="10">Ensure authorized access on demand</text>
    <text x="0" y="95" text-anchor="middle" fill="#F472B6" font-size="9">DDoS Shields, RAID, Multi-AZ</text>
  </g>

  <!-- Connecting Triangle Lines -->
  <line x1="390" y1="130" x2="250" y2="280" stroke="#334155" stroke-width="3"/>
  <line x1="450" y1="130" x2="590" y2="280" stroke="#334155" stroke-width="3"/>
  <line x1="270" y1="310" x2="570" y2="310" stroke="#334155" stroke-width="3"/>

  <!-- Center Security Core -->
  <circle cx="420" cy="245" r="28" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <text x="420" y="250" text-anchor="middle" fill="#FBBF24" font-size="10" font-weight="800">CYBER</text>
  <text x="420" y="260" text-anchor="middle" fill="#FBBF24" font-size="8">DEFENSE</text>

  <text x="420" y="430" text-anchor="middle" fill="#CBD5E1" font-size="11">Placement Trap: Ransomware attacks violate Availability (encrypted lockout) AND Confidentiality (data exfiltration).</text>
</svg>
