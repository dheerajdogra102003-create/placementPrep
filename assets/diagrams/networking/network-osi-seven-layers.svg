<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="100%" height="100%" style="background: linear-gradient(135deg, #090D16 0%, #111827 100%); border-radius: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <title>OSI 7-Layer Reference Model</title>
  <text x="430" y="34" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800">The OSI 7-Layer Reference Model &amp; Protocol Hierarchy</text>
  <text x="430" y="54" text-anchor="middle" fill="#94A3B8" font-size="12">Mnemonic: "All People Seem To Need Data Processing" (Top to Bottom: 7 to 1)</text>

  <!-- Table Header -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="800" height="32" rx="6" fill="#1E293B"/>
    <text x="35" y="21" fill="#94A3B8" font-size="11" font-weight="700">#</text>
    <text x="140" y="21" fill="#94A3B8" font-size="11" font-weight="700">Layer Name</text>
    <text x="270" y="21" fill="#94A3B8" font-size="11" font-weight="700">PDU (Data Unit)</text>
    <text x="420" y="21" fill="#94A3B8" font-size="11" font-weight="700">Key Protocols</text>
    <text x="610" y="21" fill="#94A3B8" font-size="11" font-weight="700">Primary Function &amp; Hardware</text>
  </g>

  <!-- Layer 7 -->
  <g transform="translate(30, 115)">
    <rect x="0" y="0" width="800" height="42" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="35" cy="21" r="13" fill="#0284C7"/><text x="35" y="26" text-anchor="middle" fill="#FFF" font-size="12" font-weight="800">7</text>
    <text x="75" y="25" fill="#38BDF8" font-size="13" font-weight="800">Application</text>
    <text x="270" y="25" fill="#F1F5F9" font-size="12" font-weight="600">Data / Message</text>
    <text x="420" y="25" fill="#A5F3FC" font-size="12">HTTP, HTTPS, DNS, FTP, SMTP</text>
    <text x="610" y="25" fill="#CBD5E1" font-size="11">User interface &amp; network apps</text>
  </g>

  <!-- Layer 6 -->
  <g transform="translate(30, 163)">
    <rect x="0" y="0" width="800" height="42" rx="6" fill="#0F172A" stroke="#334155"/>
    <circle cx="35" cy="21" r="13" fill="#2563EB"/><text x="35" y="26" text-anchor="middle" fill="#FFF" font-size="12" font-weight="800">6</text>
    <text x="75" y="25" fill="#60A5FA" font-size="13" font-weight="800">Presentation</text>
    <text x="270" y="25" fill="#F1F5F9" font-size="12" font-weight="600">Formatted Data</text>
    <text x="420" y="25" fill="#BAE6FD" font-size="12">SSL/TLS, JPEG, ASCII, MPEG</text>
    <text x="610" y="25" fill="#CBD5E1" font-size="11">Encryption, Compression, Syntax</text>
  </g>

  <!-- Layer 5 -->
  <g transform="translate(30, 211)">
    <rect x="0" y="0" width="800" height="42" rx="6" fill="#0F172A" stroke="#334155"/>
    <circle cx="35" cy="21" r="13" fill="#4F46E5"/><text x="35" y="26" text-anchor="middle" fill="#FFF" font-size="12" font-weight="800">5</text>
    <text x="75" y="25" fill="#818CF8" font-size="13" font-weight="800">Session</text>
    <text x="270" y="25" fill="#F1F5F9" font-size="12" font-weight="600">Session Data</text>
    <text x="420" y="25" fill="#C7D2FE" font-size="12">NetBIOS, RPC, PPTP, Sockets</text>
    <text x="610" y="25" fill="#CBD5E1" font-size="11">Dialog control, token management</text>
  </g>

  <!-- Layer 4 -->
  <g transform="translate(30, 259)">
    <rect x="0" y="0" width="800" height="42" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1.5"/>
    <circle cx="35" cy="21" r="13" fill="#7C3AED"/><text x="35" y="26" text-anchor="middle" fill="#FFF" font-size="12" font-weight="800">4</text>
    <text x="75" y="25" fill="#C084FC" font-size="13" font-weight="800">Transport</text>
    <text x="270" y="25" fill="#F472B6" font-size="12" font-weight="700">Segment / Datagram</text>
    <text x="420" y="25" fill="#FBCFE8" font-size="12" font-weight="700">TCP (Reliable), UDP (Fast)</text>
    <text x="610" y="25" fill="#CBD5E1" font-size="11">Port addressing, flow &amp; error control</text>
  </g>

  <!-- Layer 3 -->
  <g transform="translate(30, 307)">
    <rect x="0" y="0" width="800" height="42" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="35" cy="21" r="13" fill="#059669"/><text x="35" y="26" text-anchor="middle" fill="#FFF" font-size="12" font-weight="800">3</text>
    <text x="75" y="25" fill="#34D399" font-size="13" font-weight="800">Network</text>
    <text x="270" y="25" fill="#34D399" font-size="12" font-weight="700">Packet</text>
    <text x="420" y="25" fill="#A7F3D0" font-size="12">IP (IPv4/IPv6), ICMP, ARP, OSPF</text>
    <text x="610" y="25" fill="#CBD5E1" font-size="11">Logical IP routing | <strong>Hardware: Router</strong></text>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(30, 355)">
    <rect x="0" y="0" width="800" height="42" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="35" cy="21" r="13" fill="#D97706"/><text x="35" y="26" text-anchor="middle" fill="#FFF" font-size="12" font-weight="800">2</text>
    <text x="75" y="25" fill="#FBBF24" font-size="13" font-weight="800">Data Link</text>
    <text x="270" y="25" fill="#FBBF24" font-size="12" font-weight="700">Frame</text>
    <text x="420" y="25" fill="#FDE68A" font-size="12">Ethernet, Wi-Fi 802.11, PPP, MAC</text>
    <text x="610" y="25" fill="#CBD5E1" font-size="11">Physical MAC addressing | <strong>Hardware: Switch</strong></text>
  </g>

  <!-- Layer 1 -->
  <g transform="translate(30, 403)">
    <rect x="0" y="0" width="800" height="42" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <circle cx="35" cy="21" r="13" fill="#DC2626"/><text x="35" y="26" text-anchor="middle" fill="#FFF" font-size="12" font-weight="800">1</text>
    <text x="75" y="25" fill="#F87171" font-size="13" font-weight="800">Physical</text>
    <text x="270" y="25" fill="#FCA5A5" font-size="12" font-weight="700">Bits (0s &amp; 1s)</text>
    <text x="420" y="25" fill="#FECACA" font-size="12">Cat6 Cables, Fiber, Radio Freq</text>
    <text x="610" y="25" fill="#CBD5E1" font-size="11">Raw electrical signaling | <strong>Hardware: Hub</strong></text>
  </g>

  <!-- Encapsulation callout -->
  <g transform="translate(30, 465)">
    <rect x="0" y="0" width="800" height="38" rx="6" fill="#1E293B"/>
    <text x="400" y="24" text-anchor="middle" fill="#E2E8F0" font-size="11">
      <tspan fill="#38BDF8" font-weight="700">Encapsulation (Sender): </tspan>Data → Segment (L4) → Packet (L3) → Frame (L2) → Bits (L1) | 
      <tspan fill="#34D399" font-weight="700">Decapsulation (Receiver): </tspan>Bits → Frame → Packet → Segment → Data
    </text>
  </g>
</svg>
