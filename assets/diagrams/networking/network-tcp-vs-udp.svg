<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%" style="background: linear-gradient(135deg, #090D16 0%, #111827 100%); border-radius: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <title>TCP vs UDP Comparison</title>
  <text x="420" y="36" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800">Protocol Face-Off: TCP (Transmission Control) vs UDP (User Datagram)</text>
  <text x="420" y="56" text-anchor="middle" fill="#94A3B8" font-size="12">Reliability vs Speed: How Transport Layer Protocols Match Use-Cases</text>

  <!-- TCP Card -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="360" height="320" rx="12" fill="url(#grad-card)" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="360" height="42" rx="12" fill="#1E293B"/>
    <text x="180" y="26" text-anchor="middle" fill="#38BDF8" font-size="15" font-weight="800">🛡️ TCP (Reliable &amp; Ordered)</text>

    <g transform="translate(20, 60)">
      <text x="0" y="20" fill="#E2E8F0" font-size="12"><strong>Connection:</strong> Connection-Oriented (3-way handshake)</text>
      <text x="0" y="45" fill="#E2E8F0" font-size="12"><strong>Reliability:</strong> 100% Guaranteed delivery (Retransmission)</text>
      <text x="0" y="70" fill="#E2E8F0" font-size="12"><strong>Ordering:</strong> Guaranteed ordered byte stream</text>
      <text x="0" y="95" fill="#E2E8F0" font-size="12"><strong>Header Size:</strong> 20–60 bytes (Large overhead)</text>
      <text x="0" y="120" fill="#E2E8F0" font-size="12"><strong>Flow &amp; Congestion:</strong> Windowing &amp; Slow Start</text>
      <text x="0" y="145" fill="#E2E8F0" font-size="12"><strong>Speed:</strong> Slower due to acknowledgments</text>
    </g>

    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="320" height="60" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="160" y="22" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="700">Typical Protocols &amp; Applications:</text>
      <text x="160" y="44" text-anchor="middle" fill="#A5F3FC" font-size="11">HTTP/HTTPS, SSH, FTP, SMTP (Banking, Web)</text>
    </g>
  </g>

  <!-- UDP Card -->
  <g transform="translate(440, 80)">
    <rect x="0" y="0" width="360" height="320" rx="12" fill="url(#grad-card)" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="360" height="42" rx="12" fill="#1E293B"/>
    <text x="180" y="26" text-anchor="middle" fill="#FBBF24" font-size="15" font-weight="800">⚡ UDP (Connectionless &amp; Ultra-Fast)</text>

    <g transform="translate(20, 60)">
      <text x="0" y="20" fill="#E2E8F0" font-size="12"><strong>Connection:</strong> Connectionless ("Fire-and-forget")</text>
      <text x="0" y="45" fill="#E2E8F0" font-size="12"><strong>Reliability:</strong> Best-effort (packets may be dropped)</text>
      <text x="0" y="70" fill="#E2E8F0" font-size="12"><strong>Ordering:</strong> Packets can arrive out of order</text>
      <text x="0" y="95" fill="#E2E8F0" font-size="12"><strong>Header Size:</strong> Exactly 8 bytes (Minimal overhead)</text>
      <text x="0" y="120" fill="#E2E8F0" font-size="12"><strong>Flow &amp; Congestion:</strong> None (transmits at application rate)</text>
      <text x="0" y="145" fill="#E2E8F0" font-size="12"><strong>Speed:</strong> Blazing fast, low latency</text>
    </g>

    <g transform="translate(20, 225)">
      <rect x="0" y="0" width="320" height="60" rx="6" fill="#0F172A" stroke="#334155"/>
      <text x="160" y="22" text-anchor="middle" fill="#FBBF24" font-size="11" font-weight="700">Typical Protocols &amp; Applications:</text>
      <text x="160" y="44" text-anchor="middle" fill="#FDE68A" font-size="11">DNS, VoIP, Live Video Streaming, Online Gaming</text>
    </g>
  </g>

  <!-- Bottom Tip -->
  <text x="420" y="425" text-anchor="middle" fill="#94A3B8" font-size="12">Interview Question: "Why does DNS use UDP port 53 by default?" Answer: Low overhead query-response with single packet roundtrip.</text>
</svg>
