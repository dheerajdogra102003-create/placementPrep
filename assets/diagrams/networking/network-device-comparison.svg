<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%" style="background: linear-gradient(135deg, #090D16 0%, #111827 100%); border-radius: 12px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
  </defs>

  <title>Network Device Comparison: Hub vs Switch vs Router</title>
  <text x="420" y="36" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800">Core Network Devices: Hub vs Switch vs Router</text>
  <text x="420" y="56" text-anchor="middle" fill="#94A3B8" font-size="12">OSI layer, addressing mechanisms, and collision/broadcast domain boundaries</text>

  <!-- Col 1: Hub -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="235" height="325" rx="10" fill="url(#grad-card)" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="235" height="42" rx="10" fill="#1E293B"/>
    <text x="117" y="26" text-anchor="middle" fill="#F87171" font-size="14" font-weight="800">🔌 Network Hub</text>

    <g transform="translate(15, 60)">
      <text x="0" y="15" fill="#38BDF8" font-size="11" font-weight="700">OSI Layer:</text>
      <text x="0" y="32" fill="#EF4444" font-size="12" font-weight="800">Layer 1 (Physical)</text>

      <text x="0" y="65" fill="#38BDF8" font-size="11" font-weight="700">Intelligence &amp; Addressing:</text>
      <text x="0" y="82" fill="#E2E8F0" font-size="10">Dumb Device (No MAC or IP)</text>
      <text x="0" y="96" fill="#FCA5A5" font-size="9">Broadcasts ALL data to all ports</text>

      <text x="0" y="128" fill="#38BDF8" font-size="11" font-weight="700">Collision Domain:</text>
      <text x="0" y="145" fill="#F87171" font-size="10" font-weight="700">1 Single Collision Domain</text>
      <text x="0" y="159" fill="#94A3B8" font-size="9">(Frequent collisions, half-duplex)</text>

      <text x="0" y="190" fill="#38BDF8" font-size="11" font-weight="700">Broadcast Domain:</text>
      <text x="0" y="207" fill="#E2E8F0" font-size="10">1 Broadcast Domain</text>

      <text x="0" y="238" fill="#38BDF8" font-size="11" font-weight="700">Status in Modern IT:</text>
      <text x="0" y="255" fill="#94A3B8" font-size="10">Obsolete (High security risk)</text>
    </g>
  </g>

  <!-- Col 2: Switch -->
  <g transform="translate(302, 85)">
    <rect x="0" y="0" width="235" height="325" rx="10" fill="url(#grad-card)" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="235" height="42" rx="10" fill="#1E293B"/>
    <text x="117" y="26" text-anchor="middle" fill="#34D399" font-size="14" font-weight="800">🔀 Network Switch</text>

    <g transform="translate(15, 60)">
      <text x="0" y="15" fill="#38BDF8" font-size="11" font-weight="700">OSI Layer:</text>
      <text x="0" y="32" fill="#10B981" font-size="12" font-weight="800">Layer 2 (Data Link)</text>

      <text x="0" y="65" fill="#38BDF8" font-size="11" font-weight="700">Intelligence &amp; Addressing:</text>
      <text x="0" y="82" fill="#E2E8F0" font-size="10">Smart Device (MAC Table)</text>
      <text x="0" y="96" fill="#34D399" font-size="9">Unicasts frame to destination port</text>

      <text x="0" y="128" fill="#38BDF8" font-size="11" font-weight="700">Collision Domain:</text>
      <text x="0" y="145" fill="#34D399" font-size="10" font-weight="700">Each port = 1 Collision Domain</text>
      <text x="0" y="159" fill="#94A3B8" font-size="9">(Zero collisions, full-duplex)</text>

      <text x="0" y="190" fill="#38BDF8" font-size="11" font-weight="700">Broadcast Domain:</text>
      <text x="0" y="207" fill="#FBBF24" font-size="10">1 Broadcast Domain (by default)</text>

      <text x="0" y="238" fill="#38BDF8" font-size="11" font-weight="700">Primary Role:</text>
      <text x="0" y="255" fill="#E2E8F0" font-size="10">Connects devices inside a LAN</text>
    </g>
  </g>

  <!-- Col 3: Router -->
  <g transform="translate(565, 85)">
    <rect x="0" y="0" width="235" height="325" rx="10" fill="url(#grad-card)" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="235" height="42" rx="10" fill="#1E293B"/>
    <text x="117" y="26" text-anchor="middle" fill="#38BDF8" font-size="14" font-weight="800">🌐 Network Router</text>

    <g transform="translate(15, 60)">
      <text x="0" y="15" fill="#38BDF8" font-size="11" font-weight="700">OSI Layer:</text>
      <text x="0" y="32" fill="#38BDF8" font-size="12" font-weight="800">Layer 3 (Network)</text>

      <text x="0" y="65" fill="#38BDF8" font-size="11" font-weight="700">Intelligence &amp; Addressing:</text>
      <text x="0" y="82" fill="#E2E8F0" font-size="10">Intelligent (Routing Table)</text>
      <text x="0" y="96" fill="#A5F3FC" font-size="9">Inspects destination IP address</text>

      <text x="0" y="128" fill="#38BDF8" font-size="11" font-weight="700">Collision Domain:</text>
      <text x="0" y="145" fill="#34D399" font-size="10" font-weight="700">Breaks collision domains</text>
      <text x="0" y="159" fill="#94A3B8" font-size="9">Each interface is isolated</text>

      <text x="0" y="190" fill="#38BDF8" font-size="11" font-weight="700">Broadcast Domain:</text>
      <text x="0" y="207" fill="#34D399" font-size="10" font-weight="700">Breaks broadcast domains</text>

      <text x="0" y="238" fill="#38BDF8" font-size="11" font-weight="700">Primary Role:</text>
      <text x="0" y="255" fill="#E2E8F0" font-size="10">Connects different networks (WAN)</text>
    </g>
  </g>

  <!-- Footer Tip -->
  <text x="420" y="435" text-anchor="middle" fill="#E2E8F0" font-size="11">Standard MCQ Question: "Which device breaks both collision domains AND broadcast domains?" Answer: <strong>Router</strong>.</text>
</svg>
