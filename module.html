    <script>
        (function () {
            const theme = localStorage.getItem('placementPrep_theme') || localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlacementPrep - Technical Module Mastery</title>
    <meta name="description" content="Master placement preparation concepts with interactive practice, timed MNC exams, and fast revision flashcards on PlacementPrep.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="module-page-body">

    <!-- Top Module Navigation Bar (Rendered dynamically by ModuleSystem) -->
    <header class="app-header"></header>

    <!-- Main Container -->
    <main class="app-main">
        <!-- Landing View (Rendered dynamically by ModuleSystem) -->
        <section id="screen-mode-select" class="screen-view active"></section>
    </main>

    <!-- Shared Architecture Scripts -->
    <script src="syncManager.js"></script>
    <script src="shared/module-system.js"></script>
    <script src="shared/cbt-exam-system.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const modId = params.get('mod') || params.get('module') || 'programming_fundamentals';
            window.ModuleSystem.init(modId);

            // Handle start mode navigation if clicking modes
            window.addEventListener('module:mode-selected', function (e) {
                const mode = e.detail.mode;
                const config = window.ModuleSystem.getConfig(modId);
                
                // If a specialized folder exists in workspace, route cleanly to it
                const routeMap = {
                    'programming_fundamentals': 'programming_fundamentals/index.html',
                    'networking': 'networking/index.html',
                    'cloud_computing': 'cloud_Computing/index.html',
                    'github': 'github/index.html',
                    'cyber_security': 'cyber_security/index.html',
                    'pseudocode': 'Pseudocode/index.html',
                    'ai_ml': 'ai_ml/index.html',
                    'linux_commands': 'linux_commands/index.html',
                    'browser_fundamental': 'browser_fundamental/index.html',
                    'office_suite': 'Microsoft%20Office%20Suite%20Mastery/index.html'
                };

                if (routeMap[modId]) {
                    window.location.href = `${routeMap[modId]}?mode=${mode}`;
                } else {
                    // Fallback to primary practice arena
                    window.location.href = `programming_fundamentals/index.html?mode=${mode}`;
                }
            });
        })();
    </script>
</body>
</html>
