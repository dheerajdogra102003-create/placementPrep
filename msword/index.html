<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Word Practice - PlacementPrep</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <a href="../index.html" class="logo-area">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-primary)"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Dashboard
            </a>
            <div class="topic-badge">MS Word</div>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Quiz Screen -->
        <div id="quiz-screen" class="flashcard-container">
            
            <div class="progress-container">
                <div class="progress-text">
                    <span id="progress-text">Question 1 of 30</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
                </div>
            </div>

            <div id="flashcard" class="card slide-enter">
                <div class="question-meta">
                    <span id="q-number" class="badge">Q1</span>
                    <span id="q-difficulty" class="badge difficulty-moderate">Moderate</span>
                    <span id="q-category" class="badge">Category</span>
                </div>
                
                <h2 id="q-text" class="question-text">Loading question...</h2>
                
                <div id="options-grid" class="options-grid">
                    <!-- Options injected here by JS -->
                </div>

                <div id="feedback-panel" class="feedback-panel">
                    <div id="feedback-header" class="feedback-header correct">
                        <!-- Icon injected by JS --> Correct!
                    </div>
                    <div id="feedback-text" class="feedback-content">
                        Explanation appears here.
                    </div>
                    <div class="real-world-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                        <div>
                            <strong>Real World App:</strong> <span id="real-world-text">Application text here.</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="module-footer">
                <button id="btn-prev" class="nav-btn btn-secondary" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;"><polyline points="15 18 9 12 15 6"></polyline></svg> Previous
                </button>
                <button id="btn-next" class="nav-btn btn-primary" disabled>
                    Next <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-left: 4px;"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>
            
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="results-screen flashcard-container card">
            <h2 style="margin-bottom: 2rem;">Assessment Complete</h2>
            
            <div id="score-circle" class="score-circle" style="--progress: 0%;">
                <div id="score-text" class="score-text">0%</div>
            </div>
            
            <h3 id="perf-category" style="color: var(--accent-primary); margin-bottom: 2rem; font-size: 1.5rem;">Needs Improvement</h3>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div id="stat-correct" class="stat-num" style="color: var(--success-text);">0</div>
                    <div class="stat-lbl">Correct Answers</div>
                </div>
                <div class="stat-box">
                    <div id="stat-incorrect" class="stat-num" style="color: var(--error-text);">0</div>
                    <div class="stat-lbl">Incorrect Answers</div>
                </div>
            </div>
            
            <div class="result-actions">
                <button id="btn-retry" class="nav-btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg> Retry Quiz
                </button>
                <button id="btn-review" class="nav-btn btn-secondary">
                    Review Incorrect
                </button>
                <a href="../index.html" class="nav-btn btn-secondary" style="text-decoration: none; display: inline-block;">
                    Back to Dashboard
                </a>
            </div>
        </div>

    </main>

    <!-- Scripts -->
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
